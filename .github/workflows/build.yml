name: TachiyomiSY AutoBuild

on:
  schedule:
    # Nightly - every day 04:00 Taiwan time
    - cron: "0 4 * * *"
      timezone: "Asia/Taipei"

    # Weekly - every Monday 07:00 Taiwan time
    - cron: "0 7 * * 1"
      timezone: "Asia/Taipei"

  workflow_dispatch:
    inputs:
      channel:
        description: Build channel
        required: true
        type: choice
        options:
          - weekly
          - nightly

permissions:
  contents: write

concurrency:
  group: tachiyomisy-autobuild
  cancel-in-progress: false

env:
  UPSTREAM_REPO: syncyomi/TachiyomiSY
  UPSTREAM_BRANCH: feat/syncyomi-v2
  RELEASE_REPO: LANqed/TachiyomiSY-AutoBuild

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || (github.event.schedule == '0 7 * * 1' && 'weekly' || 'nightly') }}

    steps:

      # ============================================================
      # Check upstream
      # ============================================================

      - name: Check upstream
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "[1/5] Checking upstream branch: $UPSTREAM_REPO#$UPSTREAM_BRANCH"

          current_sha="$(
            curl -fsSL \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$UPSTREAM_REPO/git/ref/heads/$UPSTREAM_BRANCH" \
              | jq -r '.object.sha'
          )"

          test -n "$current_sha"
          test "$current_sha" != "null"

          echo "Current upstream SHA: $current_sha"

          echo "[2/5] Reading existing $CHANNEL releases"

          timeout 30s \
            gh api \
            "repos/$RELEASE_REPO/releases?per_page=100" \
            > releases.json

          echo "[3/5] Finding latest $CHANNEL release marker"

          asset_url="$(
            python3 -c '
          import json
          import sys

          channel = sys.argv[1]
          data = json.load(open("releases.json", encoding="utf-8"))

          prefix = channel + "-"

          releases = [
              release
              for release in data
              if str(release.get("tag_name", "")).startswith(prefix)
          ]

          releases.sort(
              key=lambda release: release.get("created_at") or ""
          )

          if not releases:
              sys.exit(0)

          release = releases[-1]

          for asset in release.get("assets") or []:
              if asset.get("name") == "upstream-commit.txt":
                  url = asset.get("browser_download_url")
                  if url:
                      print(url)
                  break
          ' "$CHANNEL"
          )"

          previous_sha=""

          if [ -n "$asset_url" ]; then
            echo "[4/5] Downloading previous upstream SHA"

            previous_sha="$(
              curl -fsSL \
                --connect-timeout 10 \
                --max-time 30 \
                "$asset_url" \
                | tr -d '[:space:]'
            )"

            if [ -z "$previous_sha" ]; then
              echo "::warning::upstream-commit.txt was empty"
            fi
          else
            echo "[4/5] No previous $CHANNEL build found"
          fi

          echo "Previous upstream SHA: ${previous_sha:-<none>}"

          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

          if [ "$current_sha" = "$previous_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[5/5] Upstream unchanged; skipping build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[5/5] Upstream changed; continuing to build"
          fi

      # ============================================================
      # Generate build version
      # ============================================================

      - name: Set build version
        if: steps.upstream.outputs.changed == 'true'
        id: version
        run: |
          set -euo pipefail

          BUILD_NUMBER="$(TZ=Asia/Taipei date '+%Y%m%d%H%M%S')"
          APP_VERSION_NAME="${CHANNEL}-${BUILD_NUMBER}"

          echo "Build channel: $CHANNEL"
          echo "Build number: $BUILD_NUMBER"
          echo "APP version: $APP_VERSION_NAME"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"

          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION_NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Checkout upstream
      # ============================================================

      - name: Checkout upstream
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          fetch-depth: 0

      # ============================================================
      # Java / Gradle / Android SDK
      # ============================================================

      - name: Set up JDK
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        if: steps.upstream.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;29.0.3"

      # ============================================================
      # Signing secrets
      # ============================================================

      - name: Validate signing secrets
        if: steps.upstream.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      # ============================================================
      # Patch upstream source
      # ============================================================

      - name: Patch updater
        if: steps.upstream.outputs.changed == 'true'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          APP_VERSION_NAME = os.environ["APP_VERSION_NAME"]

          # ==========================================================
          # app/build.gradle.kts
          # ==========================================================

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = 'if (gradle.startParameter.taskRequests.toString().contains("Release")) {'

          start = s.find(marker)

          if start < 0:
              raise SystemExit(
                  "Google Services plugin block not found"
              )

          end = s.find("\n}\n", start)

          if end < 0:
              raise SystemExit(
                  "Google Services plugin block end not found"
              )

          s = (
              s[:start]
              + "// AutoBuild: Google Services / Crashlytics disabled.\n"
              + s[end + 3:]
          )

          for dep in (
              "    implementation(platform(libs.firebase.bom))\n",
              "    implementation(libs.firebase.analytics)\n",
              "    implementation(libs.firebase.crashlytics)\n",
          ):
              s = s.replace(dep, "", 1)

          s, replaced = re.subn(
              r'        versionCode = \d+',
              "        versionCode = 1000000",
              s,
              count=1,
          )

          if replaced != 1:
              raise SystemExit(
                  "versionCode declaration not found"
              )

          s, replaced = re.subn(
              r'        versionName = ".*?"',
              f'        versionName = System.getenv("APP_VERSION_NAME") ?: "{APP_VERSION_NAME}"',
              s,
              count=1,
          )

          if replaced != 1:
              raise SystemExit(
                  "versionName declaration not found"
              )

          p.write_text(s)

          # ==========================================================
          # FlexibleAdapter
          # ==========================================================

          p = Path("gradle/libs.versions.toml")
          s = p.read_text()

          if 'flexibleAdapter = "c8013533"' not in s:
              raise SystemExit(
                  "FlexibleAdapter version c8013533 not found"
              )

          s = s.replace(
              'flexibleAdapter = "c8013533"',
              'flexibleAdapter = "5.1.0"',
              1,
          )

          old_module = (
              "com.github.arkon.FlexibleAdapter:flexible-adapter"
          )

          new_module = (
              "eu.davidea:flexible-adapter"
          )

          if old_module not in s:
              raise SystemExit(
                  "FlexibleAdapter Maven coordinate not found"
              )

          s = s.replace(
              old_module,
              new_module,
              1,
          )

          p.write_text(s)

          # ==========================================================
          # MainActivity
          # ==========================================================

          main = Path(
              "app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt"
          )

          s = main.read_text()

          for line in (
              "import com.google.firebase.Firebase\n",
              "import com.google.firebase.analytics.analytics\n",
              "import eu.kanade.tachiyomi.util.system.isPreviewBuildType\n",
              "import exh.syDebugVersion\n",
          ):
              s = s.replace(line, "")

          pattern = (
              r'    private fun addAnalytics\(\) \{\n'
              r'        if \(\!BuildConfig\.DEBUG && isPreviewBuildType\) \{\n'
              r'            Firebase\.analytics\.setUserProperty\('
              r'"preview_version", syDebugVersion\)\n'
              r'        \}\n'
              r'    \}'
          )

          s, replaced = re.subn(
              pattern,
              "    private fun addAnalytics() {}",
              s,
              count=1,
          )

          if replaced != 1:
              raise SystemExit(
                  "MainActivity Firebase analytics block not found"
              )

          main.write_text(s)

          # ==========================================================
          # Crashlytics no-op
          # ==========================================================

          crashlytics = Path(
              "app/src/main/java/exh/log/CrashlyticsPrinter.kt"
          )

          crashlytics.write_text(
          """package exh.log

          import com.elvishew.xlog.printer.Printer

          /** No-op implementation for AutoBuild builds without Firebase. */
          class CrashlyticsPrinter(
              private val logLevel: Int,
          ) : Printer {
              override fun println(
                  logLevel: Int,
                  tag: String?,
                  msg: String?,
              ) = Unit
          }
          """
          )

          # ==========================================================
          # FirebaseConfig no-op
          # ==========================================================

          firebase_config = Path(
              "app/src/release/java/mihon/core/firebase/FirebaseConfig.kt"
          )

          firebase_config.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          firebase_config.write_text(
          """package mihon.core.firebase

          import android.content.Context

          /** No-op implementation for AutoBuild builds without Firebase. */
          object FirebaseConfig {
              fun init(context: Context) = Unit

              fun setAnalyticsEnabled(
                  enabled: Boolean,
              ) = Unit

              fun setCrashlyticsEnabled(
                  enabled: Boolean,
              ) = Unit
          }
          """
          )

          # ==========================================================
          # AndroidManifest Firebase removal
          # ==========================================================

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          s = manifest.read_text()

          for block in (
              """    <!-- Remove unnecessary permissions from Firebase dependency -->
              <uses-permission
                  android:name="com.google.android.finsky.permission.BIND_GET_INSTALL_REFERRER_SERVICE"
                  tools:node="remove" />

              <uses-permission
                  android:name="com.google.android.gms.permission.AD_ID"
                  tools:node="remove" />

              <uses-permission
                  android:name="android.permission.ACCESS_ADSERVICES_ATTRIBUTION"
                  tools:node="remove" />

              <uses-permission
                  android:name="android.permission.ACCESS_ADSERVICES_AD_ID"
                  tools:node="remove" />

              """,
              """        <!-- Disable for manual opt-in -->
              <meta-data
                  android:name="firebase_analytics_collection_enabled"
                  android:value="false" />
              <meta-data
                  android:name="firebase_crashlytics_collection_enabled"
                  android:value="false" />

              <!-- Disable advertising ID collection for Firebase -->
              <meta-data
                  android:name="google_analytics_adid_collection_enabled"
                  android:value="false" />

              """,
          ):
              s = s.replace(block, "")

          manifest.write_text(s)

          # ==========================================================
          # AutoBuild version
          # ==========================================================

          Path(
              "app/src/main/java/exh/Version.kt"
          ).write_text(
              "package exh\n\n"
              f'const val syDebugVersion: String = "{APP_VERSION_NAME}"\n'
          )

          # ==========================================================
          # AppUpdateChecker
          # ==========================================================

          Path(
              "app/src/main/java/eu/kanade/tachiyomi/data/updater/AppUpdateChecker.kt"
          ).write_text(
          """package eu.kanade.tachiyomi.data.updater

          import android.content.Context
          import eu.kanade.domain.base.BasePreferences
          import eu.kanade.tachiyomi.BuildConfig
          import exh.syDebugVersion
          import tachiyomi.core.common.util.lang.withIOContext
          import tachiyomi.domain.release.interactor.GetApplicationRelease
          import uy.kohesive.injekt.injectLazy

          class AppUpdateChecker {

              private val getApplicationRelease:
                  GetApplicationRelease by injectLazy()

              private val basePreferences:
                  BasePreferences by injectLazy()

              suspend fun checkForUpdate(
                  context: Context,
                  forceCheck: Boolean = false,
              ): GetApplicationRelease.Result = withIOContext {

                  val channel = basePreferences.updateChannel.get()

                  val lastChannel =
                      basePreferences.lastUpdateCheckChannel.get()

                  val channelChanged =
                      lastChannel != channel

                  val result = getApplicationRelease.await(
                      GetApplicationRelease.Arguments(
                          true,
                          BuildConfig.COMMIT_COUNT.toInt(),
                          BuildConfig.VERSION_NAME,
                          "$GITHUB_REPO#$channel",
                          syDebugVersion,
                          forceCheck || channelChanged,
                      ),
                  )

                  basePreferences.lastUpdateCheckChannel.set(channel)

                  when (result) {
                      is GetApplicationRelease.Result.NewUpdate ->
                          AppUpdateNotifier(context).promptUpdate(result.release)

                      else -> Unit
                  }

                  result
              }
          }

          const val GITHUB_REPO =
              "LANqed/TachiyomiSY-AutoBuild"
          """
          )

          # ==========================================================
          # ReleaseServiceImpl
          # ==========================================================

          Path(
              "data/src/main/java/tachiyomi/data/release/ReleaseServiceImpl.kt"
          ).write_text(
          """package tachiyomi.data.release

          import eu.kanade.tachiyomi.network.GET
          import eu.kanade.tachiyomi.network.NetworkHelper
          import eu.kanade.tachiyomi.network.awaitSuccess
          import eu.kanade.tachiyomi.network.parseAs
          import kotlinx.serialization.json.Json
          import tachiyomi.domain.release.model.Release
          import tachiyomi.domain.release.service.ReleaseService

          class ReleaseServiceImpl(
              private val networkService: NetworkHelper,
              private val json: Json,
          ) : ReleaseService {

              override suspend fun latest(
                  repository: String,
              ): Release {

                  val channel =
                      repository.substringAfter("#", "weekly")

                  val repo =
                      repository.substringBefore("#")

                  return with(json) {
                      networkService.client
                          .newCall(
                              GET(
                                  "https://api.github.com/repos/$repo/releases?per_page=100"
                              )
                          )
                          .awaitSuccess()
                          .parseAs<List<GithubRelease>>()
                          .firstOrNull {
                              it.version.startsWith("$channel-")
                          }
                          ?.let(releaseMapper)
                          ?: error(
                              "No $channel release found in $repo"
                          )
                  }
              }
          }
          """
          )

          # ==========================================================
          # GetApplicationRelease
          # ==========================================================

          p = Path(
              "domain/src/main/java/tachiyomi/domain/release/interactor/GetApplicationRelease.kt"
          )

          s = p.read_text()

          old_pref = (
              '    private val lastChecked: Preference<Long> by lazy {\n'
              '        preferenceStore.getLong('
              'Preference.appStateKey("last_app_check"), 0)\n'
              '    }\n'
              '\n'
          )

          if old_pref not in s:
              raise SystemExit(
                  "GetApplicationRelease lastChecked block not found"
              )

          s = s.replace(
              old_pref,
              "",
              1,
          )

          old = (
              "        val now = Instant.now()\n"
              "\n"
              "        // Limit checks to once every 3 days at most\n"
              "        val nextCheckTime = "
              "Instant.ofEpochMilli(lastChecked.get()).plus(3, ChronoUnit.DAYS)\n"
              "        if (!arguments.forceCheck && now.isBefore(nextCheckTime)) {\n"
              "            return Result.NoNewUpdate\n"
              "        }\n"
              "\n"
              "        val release = "
              "service.latest(arguments.repository)\n"
              "\n"
              "        lastChecked.set(now.toEpochMilli())"
          )

          new = (
              "        val now = Instant.now()\n"
              "\n"
              "        val channel = "
              'arguments.repository.substringAfter("#", "weekly")\n'
              "\n"
              "        val lastChecked = preferenceStore.getLong(\n"
              '            Preference.appStateKey("last_app_check_$channel"),\n'
              "            0,\n"
              "        )\n"
              "\n"
              '        val checkIntervalDays = if (channel == "nightly") 1L else 7L\n'
              "\n"
              "        val nextCheckTime = "
              "Instant.ofEpochMilli(lastChecked.get())\n"
              "            .plus(checkIntervalDays, ChronoUnit.DAYS)\n"
              "\n"
              "        if (!arguments.forceCheck && "
              "now.isBefore(nextCheckTime)) {\n"
              "            return Result.NoNewUpdate\n"
              "        }\n"
              "\n"
              "        val release = "
              "service.latest(arguments.repository)\n"
              "\n"
              "        lastChecked.set(now.toEpochMilli())"
          )

          if old not in s:
              raise SystemExit(
                  "GetApplicationRelease check block not found"
              )

          s = s.replace(
              old,
              new,
              1,
          )

          # ----------------------------------------------------------
          # Replace version comparison
          # ----------------------------------------------------------

          old_function_pattern = (
              r'    // SY -->\n'
              r'    private fun isNewVersion\(\n'
              r'        isPreview: Boolean,\n'
              r'        syDebugVersion: String,\n'
              r'        versionName: String,\n'
              r'        versionTag: String,\n'
              r'    \): Boolean \{\n'
              r'.*?\n'
              r'    \}\n'
              r'    // SY <--'
          )

          new_function = """    // SY -->
              private fun isNewVersion(
                  isPreview: Boolean,
                  syDebugVersion: String,
                  versionName: String,
                  versionTag: String,
              ): Boolean {
                  // AutoBuild compares the complete version string.
                  //
                  // Only an identical version means "already up to date".
                  //
                  // This allows:
                  //   weekly -> newer weekly
                  //   weekly -> older weekly
                  //   weekly -> nightly
                  //   nightly -> weekly
                  //   nightly -> older nightly
                  return versionTag != versionName
              }
              // SY <--"""

          s, replaced = re.subn(
              old_function_pattern,
              new_function,
              s,
              count=1,
              flags=re.S,
          )

          if replaced != 1:
              raise SystemExit(
                  "GetApplicationRelease version comparison function not found"
              )

          p.write_text(s)

          # ==========================================================
          # BasePreferences
          # ==========================================================

          p = Path(
              "app/src/main/java/eu/kanade/domain/base/BasePreferences.kt"
          )

          s = p.read_text()

          marker = (
              '    val installationId: Preference<String> = '
              'preferenceStore.getString('
              'Preference.appStateKey("installation_id"), "")'
          )

          addition = """    val updateChannel: Preference<String> =
              preferenceStore.getString(
                  Preference.appStateKey("update_channel"),
                  "weekly",
              )

          val lastUpdateCheckChannel: Preference<String> =
              preferenceStore.getString(
                  Preference.appStateKey("last_update_check_channel"),
                  "",
              )

          """ + marker

          if marker not in s:
              raise SystemExit(
                  "BasePreferences insertion point not found"
              )

          p.write_text(
              s.replace(
                  marker,
                  addition,
                  1,
              )
          )

          # ==========================================================
          # SettingsAdvancedScreen
          # ==========================================================

          p = Path(
              "app/src/main/java/"
              "eu/kanade/presentation/more/settings/screen/"
              "SettingsAdvancedScreen.kt"
          )

          s = p.read_text()

          marker = "        return listOf(\n"

          addition = """        return listOf(
              Preference.PreferenceItem.ListPreference(
                  preference = basePreferences.updateChannel,
                  entries = mapOf(
                      "weekly" to "Weekly (7 days)",
                      "nightly" to "Nightly (24 hours)",
                  ),
                  title = "Update channel",
              ),
          """

          if marker not in s:
              raise SystemExit(
                  "SettingsAdvancedScreen return list not found"
              )

          p.write_text(
              s.replace(
                  marker,
                  addition,
                  1,
              )
          )

          PY

      # ============================================================
      # Generate changelog
      # ============================================================

      - name: Generate changelog
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ steps.upstream.outputs.current_sha }}
          PREVIOUS_SHA: ${{ steps.upstream.outputs.previous_sha }}
          APP_VERSION_NAME: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS_SHA" ]; then
            gh api \
              "repos/$UPSTREAM_REPO/compare/$PREVIOUS_SHA...$CURRENT_SHA" \
              --jq '.commits[] | [.sha, (.commit.message | split("\n")[0]), (.author.login // .commit.author.name)] | @tsv' \
              > commits.tsv
          else
            gh api \
              "repos/$UPSTREAM_REPO/commits?sha=$UPSTREAM_BRANCH&per_page=20" \
              --jq '.[] | [.sha, (.commit.message | split("\n")[0]), (.author.login // .commit.author.name)] | @tsv' \
              > commits.tsv
          fi

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape
          import os

          channel = os.environ["CHANNEL"]
          app_version = os.environ["APP_VERSION_NAME"]

          lines = Path("commits.tsv").read_text().splitlines()

          if not lines:
              lines = [
                  "0000000\tInitial build\tunknown"
              ]

          out = [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<changelog bulletedList="true">',
              (
                  '    <changelogversion '
                  f'changeDate="{datetime.now(timezone.utc):%Y-%m-%d}" '
                  f'versionName="{escape(app_version)}">'
              ),
          ]

          for line in lines:
              parts = line.split("\t", 2)

              message = (
                  parts[1]
                  if len(parts) > 1
                  else "Update"
              )

              author = (
                  parts[2]
                  if len(parts) > 2
                  else "unknown"
              )

              out.append(
                  "        "
                  f"<changelogtext>{escape(message)} "
                  f"(@{escape(author)})</changelogtext>"
              )

          out += [
              "    </changelogversion>",
              "</changelog>",
              "",
          ]

          Path(
              "app/src/main/res/raw/changelog_debug.xml"
          ).write_text(
              "\n".join(out)
          )
          PY

          {
            echo "## TachiyomiSY $CHANNEL"
            echo
            echo "**Version:** \`$APP_VERSION_NAME\`"
            echo
            echo "**Upstream:** $UPSTREAM_REPO"
            echo
            echo "**Branch:** $UPSTREAM_BRANCH"
            echo
            echo "**Commit:** [$CURRENT_SHA](https://github.com/$UPSTREAM_REPO/commit/$CURRENT_SHA)"
            echo
            echo "### Changelog"
            echo

            while IFS=$'\t' read -r sha message author; do
              [ -n "$message" ] || continue

              if [ -n "$author" ]; then
                echo "- $message (@$author)"
              else
                echo "- $message"
              fi
            done < commits.tsv

            echo
            if [ "$CHANNEL" = "weekly" ]; then
              echo "Channel: Weekly"
              echo "Update interval: 7 days"
            else
              echo "Channel: Nightly"
              echo "Update interval: 24 hours"
            fi
          } > release_notes.md

      # ============================================================
      # Build
      # ============================================================

      - name: Build
        if: steps.upstream.outputs.changed == 'true'
        run: |
          ./gradlew assembleRelease --stacktrace

      # ============================================================
      # Decode keystore
      # ============================================================

      - name: Decode keystore
        if: steps.upstream.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > signing.jks

          test -s signing.jks

      # ============================================================
      # Detect JKS alias
      # ============================================================

      - name: Detect alias
        if: steps.upstream.outputs.changed == 'true'
        id: keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          alias="$(
            keytool \
              -list \
              -v \
              -keystore signing.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              2>/dev/null \
              | awk -F': ' '/^Alias name:/{print $2; exit}'
          )"

          test -n "$alias"

          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Sign APKs
      # ============================================================

      - name: Sign APKs
        if: steps.upstream.outputs.changed == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ steps.keystore.outputs.alias }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # ============================================================
      # Prepare release files
      # ============================================================

      - name: Prepare release
        if: steps.upstream.outputs.changed == 'true'
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          CURRENT_SHA: ${{ steps.upstream.outputs.current_sha }}
        run: |
          set -euo pipefail

          cd app/build/outputs/apk/release

          universal="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*universal*unsigned-signed.apk' \
              | head -n1
          )"

          arm64="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*arm64-v8a*unsigned-signed.apk' \
              | head -n1
          )"

          arm32="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*armeabi-v7a*unsigned-signed.apk' \
              | head -n1
          )"

          x86="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*x86-release-unsigned-signed.apk' \
              | head -n1
          )"

          x86_64="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*x86_64*unsigned-signed.apk' \
              | head -n1
          )"

          for apk in \
            "$universal" \
            "$arm64" \
            "$arm32" \
            "$x86" \
            "$x86_64"
          do
            test -n "$apk" || {
              echo "::error::Signed APK set incomplete"
              exit 1
            }
          done

          mv "$universal" \
            "$GITHUB_WORKSPACE/TachiyomiSY-universal-$CHANNEL-$BUILD_NUMBER.apk"

          mv "$arm64" \
            "$GITHUB_WORKSPACE/TachiyomiSY-arm64-v8a-$CHANNEL-$BUILD_NUMBER.apk"

          mv "$arm32" \
            "$GITHUB_WORKSPACE/TachiyomiSY-armeabi-v7a-$CHANNEL-$BUILD_NUMBER.apk"

          mv "$x86" \
            "$GITHUB_WORKSPACE/TachiyomiSY-x86-$CHANNEL-$BUILD_NUMBER.apk"

          mv "$x86_64" \
            "$GITHUB_WORKSPACE/TachiyomiSY-x86_64-$CHANNEL-$BUILD_NUMBER.apk"

          cd "$GITHUB_WORKSPACE"

          printf '%s\n' "$CURRENT_SHA" \
            > upstream-commit.txt

          printf '%s\n' "$CHANNEL" \
            > channel.txt

          sha256sum \
            "TachiyomiSY-universal-$CHANNEL-$BUILD_NUMBER.apk" \
            "TachiyomiSY-arm64-v8a-$CHANNEL-$BUILD_NUMBER.apk" \
            "TachiyomiSY-armeabi-v7a-$CHANNEL-$BUILD_NUMBER.apk" \
            "TachiyomiSY-x86-$CHANNEL-$BUILD_NUMBER.apk" \
            "TachiyomiSY-x86_64-$CHANNEL-$BUILD_NUMBER.apk" \
            > SHA256SUMS.txt

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Release
        if: steps.upstream.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CHANNEL }}-${{ steps.version.outputs.build_number }}
          name: TachiyomiSY ${{ env.CHANNEL }} ${{ steps.version.outputs.build_number }}
          body_path: release_notes.md

          files: |
            TachiyomiSY-universal-${{ env.CHANNEL }}-${{ steps.version.outputs.build_number }}.apk
            TachiyomiSY-arm64-v8a-${{ env.CHANNEL }}-${{ steps.version.outputs.build_number }}.apk
            TachiyomiSY-armeabi-v7a-${{ env.CHANNEL }}-${{ steps.version.outputs.build_number }}.apk
            TachiyomiSY-x86-${{ env.CHANNEL }}-${{ steps.version.outputs.build_number }}.apk
            TachiyomiSY-x86_64-${{ env.CHANNEL }}-${{ steps.version.outputs.build_number }}.apk
            upstream-commit.txt
            channel.txt
            SHA256SUMS.txt

          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ github.token }}
